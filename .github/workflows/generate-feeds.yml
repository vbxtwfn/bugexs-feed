name: Generate JSON Feeds

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 -q

      - name: Generate feeds
        run: |
          mkdir -p feeds
          python3 bugexs_feed.py -t lastupdate -o feeds/lastupdate.json
          python3 bugexs_feed.py -t monthvote -o feeds/monthvote.json
          python3 bugexs_feed.py -t home -o feeds/home.json
          python3 bugexs_feed.py -t dayvisit -o feeds/dayvisit.json
          python3 bugexs_feed.py -t weekvote -o feeds/weekvote.json

      - name: Deploy via GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 << 'PYEOF'
import urllib.request, json, base64, os, glob

token = os.environ['GITHUB_TOKEN']
repo = os.environ['REPO']
api = f"https://api.github.com/repos/{repo}"

def api_call(method, url, data=None):
    headers = {
        "Authorization": f"token {token}",
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
    }
    req = urllib.request.Request(url, data=data, headers=headers, method=method)
    try:
        with urllib.request.urlopen(req) as resp:
            return json.load(resp)
    except urllib.error.HTTPError as e:
        body = json.loads(e.read().decode())
        print(f"API Error {e.code}: {body.get('message', body)}")
        raise

# Get current gh-pages commit SHA
ref = api_call("GET", f"{api}/git/ref/heads/gh-pages")
commit_sha = ref["object"]["sha"]

# Get existing tree (to preserve .github etc.)
existing_tree = api_call("GET", f"{api}/git/trees/{commit_sha}?recursive=1")
base_tree = commit_sha

# Build new tree with existing files + new feeds
tree_items = []
# Keep existing blobs
for item in existing_tree.get('tree', []):
    if item['path'].startswith('.github/'):
        tree_items.append({
            "path": item['path'],
            "mode": item['mode'],
            "type": item['type'],
            "sha": item['sha']
        })

# Add new feeds files
for fpath in glob.glob("feeds/*.json"):
    fname = os.path.basename(fpath)
    with open(fpath) as f:
        content = f.read()
    blob = api_call("POST", f"{api}/git/blobs",
        json.dumps({"content": content, "encoding": "utf-8"}).encode()
    )
    tree_items.append({
        "path": f"feeds/{fname}",
        "mode": "100644",
        "type": "blob",
        "sha": blob["sha"]
    })
    print(f"✅ Added feeds/{fname}")

# Create new tree
new_tree = api_call("POST", f"{api}/git/trees",
    json.dumps({"tree": tree_items, "base_tree": base_tree}).encode()
)

# Create commit
new_commit = api_call("POST", f"{api}/git/commits",
    json.dumps({
        "message": f"Update feeds {__import__('datetime').datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')}",
        "tree": new_tree["sha"],
        "parents": [commit_sha]
    }).encode()
)

# Update ref
api_call("PATCH", f"{api}/git/refs/heads/gh-pages",
    json.dumps({"sha": new_commit["sha"]}).encode()
)

print(f"\n🎉 Deploy complete! Commit: {new_commit['sha'][:7]}")
PYEOF
